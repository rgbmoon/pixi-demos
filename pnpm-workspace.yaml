packages:
  - packages/*
  - games/*
  - web

# postinstall этих пакетов не запускается. msw копирует файл service worker в каталоги из поля
# `msw.workerDirectory`, в проекте этого поля нет. unrs-resolver проверяет, что пакет
# `@unrs/resolver-binding-<платформа>` установлен; pnpm устанавливает его из optionalDependencies
ignoredBuiltDependencies:
  - msw
  - unrs-resolver

# Версии зависимостей, общих для нескольких пакетов. У всех пакетов одна версия библиотеки,
# поэтому в бандл попадает один её экземпляр
catalog:
  '@esotericsoftware/spine-pixi-v8': ~4.2.119
  '@mswjs/interceptors': ^0.41.9
  '@pixi/devtools': ^2.0.1
  '@playwright/test': ^1.63.0
  '@types/node': ^26.1.1
  '@vitest/coverage-v8': ^4.1.11
  eventemitter3: ^5.0.4
  inversify: ^8.1.3
  jsdom: ^29.1.1
  mobx: ^6.16.1
  msw: ^2.15.0
  nanoid: ^6.0.0
  partysocket: ^1.3.0
  pixi.js: ^8.19.0
  reflect-metadata: ^0.2.2
  vite: ^8.1.3
  vitest: ^4.1.11
  zod: ^4.4.3
